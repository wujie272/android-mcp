[project]
name = "android-mcp"
version = "0.4.0"
description = "Android MCP Server — control your Android phone from AI via Model Context Protocol"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "xlisp"},
    {name = "wujie272", email = "jaye2720@users.noreply.github.com"},
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
android-mcp = "server:main"
